<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Rides - Global Hyperlocal EV Simulator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.98); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 320px;
        }
        h3 { margin: 0 0 12px 0; color: #1e293b; font-size: 18px; border-bottom: 2px solid #3b82f6; padding-bottom: 5px; }
        .setting-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; text-transform: uppercase; }
        select, input[type="range"], input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #3b82f6; outline: none; }
        .search-btn { width: 100%; margin-top: 6px; background: #3b82f6; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background: #2563eb; }
        .stats { background: #f8fafc; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>Macro Rides Engine</h3>
        
        <div class="setting-group">
            <label for="location-input">Type Any Location:</label>
            <input type="text" id="location-input" placeholder="e.g., IIT Kanpur, Paris, Tokyo" value="IIT Kanpur">
            <button class="search-btn" onclick="geocodeAddress()">Teleport Engine</button>
        </div>

        <div class="setting-group">
            <label>Corridor Radius: <span id="radius-val">350</span>m</label>
            <input type="range" id="radius-slider" min="100" max="1000" step="50" value="350" oninput="updateParams()">
        </div>

        <div class="setting-group">
            <label for="h3-res">H3 Grid Resolution:</label>
            <select id="h3-res" onchange="updateParams()">
                <option value="8">Resolution 8 (~700m)</option>
                <option value="9" selected>Resolution 9 (~100m)</option>
                <option value="10">Resolution 10 (~40m)</option>
            </select>
        </div>

        <div class="stats">
            <div><strong>Active Corridor Pickups:</strong> <span id="pickup-count" style="color: #ef4444; font-weight: bold;">0</span></div>
            <div><strong>H3 Cells In View Buffer:</strong> <span id="cell-count" style="color: #3b82f6; font-weight: bold;">0</span></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

    <script>
        // Initialize State variables
        let bufferRadius = 350;
        let h3Resolution = 9;
        let step = 0;
        let pathCoordinates = [];
        let mockPickups = [];
        let simInterval = null;

        // Render Base Map Canvas
        const map = L.map('map').setView([26.5123, 80.2329], 14); // Default startup center at IIT Kanpur coordinates
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        // Map Layers
        let driverMarker = null, bufferLayer = null, routeLayer = null;
        let pickupLayerGroup = L.layerGroup().addTo(map);

        // 1. Geocoding Engine Interface
        async function geocodeAddress() {
            const query = document.getElementById('location-input').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    // Relocate map context structure frame
                    map.setView([lat, lon], 14);
                    generateDynamicData(lat, lon);
                } else {
                    alert("Location not found. Try adding a city name.");
                }
            } catch (error) {
                console.error("Geocoding retrieval pipe failure:", error);
            }
        }

        // 2. Procedural Mock Data Generator around user-selected point
        function generateDynamicData(centerLat, centerLon) {
            if (routeLayer) map.removeLayer(routeLayer);
            step = 0;

            // Generate an artificial route line around the target coordinates
            const startLngLat = [centerLon - 0.01, centerLat + 0.005];
            const endLngLat = [centerLon + 0.01, centerLat - 0.005];
            
            const routeLine = turf.lineString([
                startLngLat,
                [centerLon - 0.003, centerLat + 0.002],
                [centerLon + 0.003, centerLat - 0.002],
                endLngLat
            ]);

            routeLayer = L.geoJSON(routeLine, { color: '#64748b', weight: 3, dashArray: '4, 8' }).addTo(map);
            
            const totalSteps = 150;
            const lineChunks = turf.lineChunk(routeLine, turf.length(routeLine) / totalSteps, { units: 'kilometers' });
            pathCoordinates = lineChunks.features.map(f => f.geometry.coordinates[0]);

            // Seed randomly distributed local mock pickup locations
            mockPickups = [
                { coords: [centerLat + 0.004, centerLon - 0.004], name: "Station Node Alpha" },
                { coords: [centerLat - 0.001, centerLon - 0.001], name: "Central Terminal Hub" },
                { coords: [centerLat - 0.006, centerLon + 0.005], name: "Residential Complex Gate" },
                { coords: [centerLat + 0.001, centerLon + 0.006], name: "Commercial High-Rise Point" }
            ];

            // Initialize baseline tracking strings
            mockPickups.forEach(p => {
                p.h3Index = h3.latLngToCell(p.coords[0], p.coords[1], h3Resolution);
            });
        }

        // 3. Mathematical Pipeline Execution
        function updateSimulation() {
            if (!pathCoordinates.length) return;
            if (step >= pathCoordinates.length) step = 0;
            
            const currentLngLat = pathCoordinates[step];
            const currentLatLon = [currentLngLat[1], currentLngLat[0]];

            if (driverMarker) map.removeLayer(driverMarker);
            if (bufferLayer) map.removeLayer(bufferLayer);
            pickupLayerGroup.clearLayers();

            driverMarker = L.circleMarker(currentLatLon, { radius: 8, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1 }).addTo(map);

            // Calculate current runtime Turf bounding matrix
            const pointFeature = turf.point(currentLngLat);
            const bufferGeoJSON = turf.buffer(pointFeature, bufferRadius, { units: 'meters' });
            bufferLayer = L.geoJSON(bufferGeoJSON, { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.15, weight: 1 }).addTo(map);

            // Quantize space boundaries into unified H3 Array indexes
            const polygonCoords = bufferGeoJSON.geometry.coordinates[0].map(coord => [coord[1], coord[0]]);
            let bufferedH3Cells = [];
            try {
                bufferedH3Cells = h3.polygonToCells(polygonCoords, h3Resolution);
            } catch(e) {}
            
            const bufferSet = new Set(bufferedH3Cells);
            document.getElementById('cell-count').innerText = bufferedH3Cells.length;

            let eligibleCount = 0;
            mockPickups.forEach(p => {
                p.h3Index = h3.latLngToCell(p.coords[0], p.coords[1], h3Resolution);
                const isEligible = bufferSet.has(p.h3Index);
                if (isEligible) eligibleCount++;

                L.circleMarker(p.coords, {
                    radius: isEligible ? 7 : 5,
                    color: isEligible ? '#ef4444' : '#94a3b8',
                    fillColor: isEligible ? '#ef4444' : '#94a3b8',
                    fillOpacity: isEligible ? 0.9 : 0.4
                }).bindPopup(`<b>${p.name}</b><br>H3 Grid Reference: ${p.h3Index}`).addTo(pickupLayerGroup);
            });

            document.getElementById('pickup-count').innerText = eligibleCount;
            step++;
        }

        function updateParams() {
            bufferRadius = parseInt(document.getElementById('radius-slider').value);
            h3Resolution = parseInt(document.getElementById('h3-res').value);
            document.getElementById('radius-val').innerText = bufferRadius;
        }

        // Initialize engine tracking structures automatically at boot step
        generateDynamicData(26.5123, 80.2329); // Start at IITK
        if (simInterval) clearInterval(simInterval);
        simInterval = setInterval(updateSimulation, 300);
    </script>
</body>
</html>
